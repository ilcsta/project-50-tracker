<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project 50 Progress</title>
<style>
  :root {
    color-scheme: light;
    --plane:        #f4f4f1;
    --surface:      #fcfcfb;
    --ink:          #0b0b0b;
    --ink-2:        #52514e;
    --muted:        #898781;
    --border:       rgba(11,11,11,0.10);
    --track:        rgba(11,11,11,0.07);
    --accent:       #2a78d6;
    --accent-2:     #1baf7a;
    --good:         #0a7c0a;
    --good-bg:      rgba(10,124,10,0.12);
    --warn:         #a5720a;
    --warn-bg:      rgba(250,178,25,0.16);
    --crit:         #c0332f;
    --crit-bg:      rgba(208,59,59,0.13);
    --shadow:       0 1px 2px rgba(11,11,11,0.05), 0 12px 32px -12px rgba(11,11,11,0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --plane:      #0c0c0c;
      --surface:    #1a1a19;
      --ink:        #ffffff;
      --ink-2:      #c3c2b7;
      --muted:      #8f8d87;
      --border:     rgba(255,255,255,0.11);
      --track:      rgba(255,255,255,0.09);
      --accent:     #4f9bf0;
      --accent-2:   #22c78c;
      --good:       #35c635;
      --good-bg:    rgba(53,198,53,0.14);
      --warn:       #f5bd3f;
      --warn-bg:    rgba(245,189,63,0.14);
      --crit:       #f0605c;
      --crit-bg:    rgba(240,96,92,0.14);
      --shadow:     0 1px 2px rgba(0,0,0,0.4), 0 20px 44px -16px rgba(0,0,0,0.6);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--plane);
    color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: clamp(16px, 4vw, 48px);
  }
  .wrap { max-width: 880px; margin: 0 auto; }

  header {
    display: flex; flex-wrap: wrap; gap: 20px 32px;
    align-items: flex-end; justify-content: space-between;
    margin-bottom: 28px;
  }
  .brand { display: flex; flex-direction: column; gap: 4px; }
  .brand h1 { margin: 0; font-size: clamp(22px, 4vw, 30px); font-weight: 700; letter-spacing: -0.02em; }

  .countdown { text-align: right; line-height: 1; }
  .countdown .num {
    font-size: clamp(40px, 9vw, 64px); font-weight: 800; letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(105deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .countdown .cap { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; margin-top: 6px; }

  .timeline { margin-bottom: 28px; }
  .timeline .row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 7px; font-weight: 600; }
  .timeline .track { height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .timeline .fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 620px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px;
    box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 14px;
  }
  .card h2 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
  .card .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 700; letter-spacing: 0.01em;
    padding: 4px 10px; border-radius: 999px; white-space: nowrap;
  }
  .pill .g { font-size: 11px; }
  .pill.good { color: var(--good); background: var(--good-bg); }
  .pill.warn { color: var(--warn); background: var(--warn-bg); }
  .pill.crit { color: var(--crit); background: var(--crit-bg); }

  .big { display: flex; align-items: baseline; gap: 8px; }
  .big .cur { font-size: 42px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .big .goal { font-size: 17px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }

  .sub { font-size: 13px; color: var(--ink-2); margin-top: -6px; }
  .sub b { color: var(--ink); font-variant-numeric: tabular-nums; }

  .bar { position: relative; height: 12px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .bar .fill {
    position: absolute; inset: 0 auto 0 0; height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width .6s cubic-bezier(.2,.7,.2,1);
  }
  .bar .mark {
    position: absolute; top: -3px; bottom: -3px; width: 2px;
    background: var(--ink); opacity: 0.55; border-radius: 2px;
  }
  .barcap { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-weight: 600; margin-top: -4px; }
  .barcap b { color: var(--ink-2); font-variant-numeric: tabular-nums; }

  .pace {
    font-size: 12.5px; line-height: 1.55; color: var(--ink-2);
    border-top: 1px solid var(--border); padding-top: 12px;
  }
  .pace b { color: var(--ink); font-variant-numeric: tabular-nums; }

  /* ---- editor ---- */
  .editor { margin-top: 18px; }
  .editor .fields { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px; }
  .editor label {
    display: flex; flex-direction: column; gap: 6px;
    font-size: 12px; font-weight: 600; color: var(--muted);
    flex: 1 1 180px;
  }
  .editor input {
    font: inherit; font-variant-numeric: tabular-nums;
    padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--plane); color: var(--ink);
    width: 100%;
  }
  .editor input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .editor button {
    font: inherit; font-weight: 700; cursor: pointer;
    padding: 10px 22px; border-radius: 10px; border: 0;
    background: linear-gradient(105deg, var(--accent), var(--accent-2));
    color: #fff; flex: 0 0 auto;
  }
  .editor button:disabled { opacity: 0.55; cursor: default; }
  .save-msg { font-size: 12.5px; font-weight: 600; min-height: 1.2em; }
  .save-msg.ok { color: var(--good); }
  .save-msg.err { color: var(--crit); }

  .forms { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
  @media (max-width: 620px) { .forms { grid-template-columns: 1fr; } }
  .forms .editor { margin-top: 0; }
  .editor .hint { font-size: 12px; color: var(--muted); margin: -4px 0 0; }

  /* ---- rosters ---- */
  .roster { margin-top: 18px; gap: 12px; }
  .roster > summary {
    list-style: none; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .roster > summary::-webkit-details-marker { display: none; }
  .roster > summary h2 { margin: 0; }
  .roster > summary::after { content: "▸ show"; font-size: 12px; font-weight: 700; color: var(--muted); }
  .roster[open] > summary::after { content: "▾ hide"; }
  .roster .count { font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
  .filter {
    font: inherit; width: 100%;
    padding: 9px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--plane); color: var(--ink);
    margin-top: 12px;
  }
  .filter:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .listwrap {
    margin-top: 12px; max-height: 280px; overflow-y: auto;
    border: 1px solid var(--border); border-radius: 12px;
  }
  .listwrap table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .listwrap th, .listwrap td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .listwrap th {
    position: sticky; top: 0; background: var(--surface);
    font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted);
  }
  .listwrap td { font-variant-numeric: tabular-nums; }
  .listwrap tbody tr:last-child td { border-bottom: 0; }
  .listwrap .delta-pos { color: var(--good); font-weight: 700; }
  .listwrap .delta-neg { color: var(--crit); font-weight: 700; }
  .empty { font-size: 13px; color: var(--muted); padding: 16px 14px; margin: 0; }

  .listwrap .rm-link {
    font: inherit; font-size: 12px; font-weight: 700;
    color: var(--crit); background: none; border: 0; padding: 0; cursor: pointer;
  }
  .listwrap .rm-link:hover { text-decoration: underline; }
  .listwrap tr.removed td { color: var(--muted); text-decoration: line-through; }
  .listwrap tr.removed td code { text-decoration: line-through; opacity: 0.7; }
  .listwrap tr.rm-note td {
    text-decoration: none; color: var(--muted);
    font-size: 11px; padding-top: 0; white-space: normal;
  }

  /* ---- remove-confirm modal ---- */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.45); padding: 20px;
  }
  .modal-backdrop[hidden] { display: none; }
  .modal {
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--border); border-radius: 16px;
    box-shadow: var(--shadow); padding: 22px;
    width: 100%; max-width: 400px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .modal h3 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .modal .detail { margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--ink-2); }
  .modal .detail b { color: var(--ink); }
  .modal label {
    display: flex; flex-direction: column; gap: 6px;
    font-size: 12px; font-weight: 600; color: var(--muted);
  }
  .modal input {
    font: inherit; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--plane); color: var(--ink);
  }
  .modal input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .modal .actions { display: flex; gap: 10px; justify-content: flex-end; }
  .modal .actions button {
    font: inherit; font-weight: 700; cursor: pointer;
    padding: 9px 18px; border-radius: 10px; border: 0;
  }
  .modal .actions .cancel { background: var(--track); color: var(--ink); }
  .modal .actions .confirm { background: var(--crit); color: #fff; }
  .modal .actions button:disabled { opacity: 0.55; cursor: default; }

  footer { margin-top: 20px; font-size: 12px; color: var(--muted); text-align: center; }
  footer b { color: var(--ink-2); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; background: var(--track); padding: 1px 5px; border-radius: 5px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Project 50 Progress</h1>
    </div>
    <div class="countdown">
      <div class="num" id="days-left">—</div>
      <div class="cap">days remaining</div>
    </div>
  </header>

  <div class="timeline">
    <div class="row"><span id="tl-start">—</span><span id="tl-pct">—</span><span id="tl-end">—</span></div>
    <div class="track"><div class="fill" id="tl-fill" style="width:0%"></div></div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="forms">
    <section class="card editor">
      <h2>Add new client start</h2>
      <p class="hint">A client who joined the caseload after tracking began.</p>
      <div class="fields">
        <label>Client code
          <input type="text" id="ns-code" placeholder="e.g. JoSm" autocomplete="off" autocapitalize="off">
        </label>
        <label>Hours / day
          <input type="number" id="ns-hours" step="0.25" min="0" inputmode="decimal" placeholder="e.g. 6">
        </label>
        <label>Your name
          <input type="text" id="ns-name" autocomplete="name" placeholder="Who's adding?">
        </label>
        <button id="ns-btn">Add start</button>
      </div>
      <div class="save-msg" id="ns-msg"></div>
    </section>

    <section class="card editor">
      <h2>Adjust existing client hours</h2>
      <p class="hint">An hours change for a client already on caseload before tracking began.</p>
      <div class="fields">
        <label>Client code
          <input type="text" id="adj-code" placeholder="e.g. AlBr" autocomplete="off" autocapitalize="off">
        </label>
        <label>Hours change
          <input type="text" id="adj-delta" inputmode="text" placeholder="e.g. +1 or -5">
        </label>
        <label>Your name
          <input type="text" id="adj-name" autocomplete="name" placeholder="Who's adjusting?">
        </label>
        <button id="adj-btn">Log adjustment</button>
      </div>
      <div class="save-msg" id="adj-msg"></div>
    </section>
  </div>

  <section class="card roster">
    <div class="head">
      <h2>New client starts <span class="count" id="ns-list-count"></span></h2>
    </div>
    <input type="text" class="filter" id="ns-filter" placeholder="Search by client code or name…" autocomplete="off">
    <div class="listwrap" id="ns-list"></div>
  </section>

  <details class="card roster" id="adj-roster">
    <summary><h2>Adjustments log <span class="count" id="adj-list-count"></span></h2></summary>
    <input type="text" class="filter" id="adj-filter" placeholder="Search by client code or name…" autocomplete="off">
    <div class="listwrap" id="adj-list"></div>
  </details>

  <footer id="footer">Connecting to Supabase…</footer>
</div>

<div class="modal-backdrop" id="rm-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="rm-title">
    <h3 id="rm-title">Remove entry</h3>
    <p class="detail" id="rm-detail"></p>
    <label>Your name
      <input type="text" id="rm-name" autocomplete="name" placeholder="Required to confirm">
    </label>
    <div class="save-msg" id="rm-msg"></div>
    <div class="actions">
      <button type="button" class="cancel" id="rm-cancel">Cancel</button>
      <button type="button" class="confirm" id="rm-confirm">Remove</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ---- Supabase data source ------------------------------------------------
const SUPABASE_URL = "https://uifijwlbgxildyhqstki.supabase.co";
const SUPABASE_KEY = "sb_publishable_tUxmvr880TAMZVoEFBJ0JQ_4oTPtQ_b";
const ROW_ID = "main";               // progress row: id = 'main', JSON in column "data"
const NAME_STORE = "p50-updater-name";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// key = property name inside the "data" JSON blob
const METRICS = [
  { key: "clientStarts", title: "New Client Starts", unit: "",     rateUnit: "/week",   dec: 0 },
  { key: "abaHours",     title: "ABA Hours / Day",   unit: " hrs", rateUnit: " hrs/wk", dec: 0 }
];

const DAY = 86400000;
const MIN_DAYS_FOR_PACE = 7; // ignore noisy projections until a baseline exists
const d2 = s => new Date(s + "T00:00:00");
const daysBetween = (a, b) => Math.round((d2(b) - d2(a)) / DAY);
const clamp01 = x => Math.max(0, Math.min(1, x));
const fmt = (n, dec = 0) => n.toLocaleString(undefined, { minimumFractionDigits: dec, maximumFractionDigits: dec });
const pct = x => Math.round(x * 100) + "%";
const monthDay = s => d2(s).toLocaleDateString(undefined, { month: "short", day: "numeric" });
const fmtDateTime = iso => {
  const dt = new Date(iso);
  if (isNaN(dt)) return String(iso ?? "—");
  return dt.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) +
    ", " + dt.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const todayStr = () => {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, "0")}-${String(n.getDate()).padStart(2, "0")}`;
};

let currentData = null;

// ---- computed metrics (derived, never stored) --------------------------
const isActive = e => e.removed !== true;
const sum = (arr, f) => (arr || []).reduce((t, x) => t + (Number(f(x)) || 0), 0);

function computeCurrent(data) {
  const starts = (data.newStarts || []).filter(isActive);
  const adjustments = (data.adjustments || []).filter(isActive);
  return {
    clientStarts: starts.length,
    abaHours: (data.abaHours.atTrackingStart ?? 0) + sum(starts, e => e.hours) + sum(adjustments, e => e.delta)
  };
}

// ---- pace / gap-closure math (unchanged) --------------------------------
function paceCheck(cur, goal, base, daysElapsed, daysLeft) {
  // Pace is measured on progress since tracking started, not total value.
  const gained = cur - base;
  const perDay = daysElapsed >= MIN_DAYS_FOR_PACE ? gained / daysElapsed : null;
  const projected = perDay !== null ? cur + perDay * daysLeft : null;
  const requiredPerDay = daysLeft > 0 ? (goal - cur) / daysLeft : null;

  let status, label, glyph;
  if (cur >= goal)                  { status = "good"; label = "Goal reached";     glyph = "✓"; }
  else if (daysLeft <= 0)           { status = "crit"; label = "Deadline passed";  glyph = "!"; }
  else if (perDay === null)         { status = "warn"; label = "Gathering data";   glyph = "·"; }
  else if (projected >= goal)       { status = "good"; label = "On pace";          glyph = "▲"; }
  else if (projected >= goal * 0.9) { status = "warn"; label = "Slightly behind";  glyph = "~"; }
  else                             { status = "crit"; label = "Behind pace";      glyph = "▼"; }

  return { perDay, projected, requiredPerDay, status, label, glyph };
}

function renderCard(cfg, data, timing) {
  const m = data[cfg.key];
  const base = m.atTrackingStart ?? 0;
  const p = paceCheck(m.current, m.goal, base, timing.daysElapsed, timing.daysLeft);

  // Progress = how much of the gap we set out to close is closed, not current / goal.
  const gap = m.goal - base;
  const progress = gap > 0 ? clamp01((m.current - base) / gap) : 0;
  const expectedFrac = timing.total > 0 ? clamp01(timing.daysElapsed / timing.total) : 0;
  const toGo = Math.max(0, m.goal - m.current);

  let paceLine;
  if (m.current >= m.goal) {
    paceLine = "Goal hit — keep it there through Dec 31.";
  } else if (p.perDay === null) {
    paceLine = `Building a baseline — pace projection starts after ${MIN_DAYS_FOR_PACE} days of history (${timing.daysElapsed} so far).`;
  } else if (p.perDay <= 0) {
    paceLine = `No net progress since ${monthDay(data.trackingStartDate)}. Need <b>+${fmt(p.requiredPerDay * 7, 1)}${cfg.rateUnit}</b> to finish in time.`;
  } else {
    paceLine =
      `Trending <b>+${fmt(p.perDay * 7, 1)}${cfg.rateUnit}</b> · need <b>+${fmt(p.requiredPerDay * 7, 1)}${cfg.rateUnit}</b>. ` +
      `Projected by Dec 31: <b>${fmt(p.projected, cfg.dec)}</b>${cfg.unit} of ${fmt(m.goal, cfg.dec)}.`;
  }

  return `
    <section class="card">
      <div class="head">
        <h2>${cfg.title}</h2>
        <span class="pill ${p.status}"><span class="g">${p.glyph}</span>${p.label}</span>
      </div>
      <div class="big">
        <span class="cur">${fmt(m.current, cfg.dec)}${cfg.unit}</span>
        <span class="goal">/ ${fmt(m.goal, cfg.dec)}${cfg.unit}</span>
      </div>
      <div class="sub"><b>${pct(progress)}</b> to goal · <b>${fmt(toGo, cfg.dec)}</b> to go</div>
      <div class="bar">
        <div class="fill" style="width:${(progress * 100).toFixed(1)}%"></div>
        <div class="mark" style="left:${(expectedFrac * 100).toFixed(1)}%" title="Pace-even mark"></div>
      </div>
      <div class="barcap"><span>now <b>${pct(progress)}</b></span><span>pace-even <b>${pct(expectedFrac)}</b></span></div>
      <div class="pace">${paceLine}</div>
    </section>`;
}

function render(data) {
  currentData = data;
  data.newStarts = data.newStarts || [];
  data.adjustments = data.adjustments || [];

  const today = todayStr();
  const timing = {
    daysElapsed: Math.max(0, daysBetween(data.trackingStartDate, today)),
    daysLeft:    Math.max(0, daysBetween(today, data.deadline)),
    total:       daysBetween(data.trackingStartDate, data.deadline)
  };

  document.getElementById("days-left").textContent = timing.daysLeft;

  const yearFrac = timing.total > 0 ? clamp01(timing.daysElapsed / timing.total) : 0;
  document.getElementById("tl-fill").style.width = (yearFrac * 100).toFixed(1) + "%";
  document.getElementById("tl-pct").textContent = pct(yearFrac) + " of the window elapsed";
  document.getElementById("tl-start").textContent = monthDay(data.trackingStartDate);
  document.getElementById("tl-end").textContent = monthDay(data.deadline);

  // Cards run off derived values; the stored blob only holds the roster + baseline.
  const cur = computeCurrent(data);
  const view = {
    ...data,
    clientStarts: { ...data.clientStarts, current: cur.clientStarts },
    abaHours:     { ...data.abaHours,     current: cur.abaHours }
  };
  document.getElementById("grid").innerHTML =
    METRICS.map(cfg => renderCard(cfg, view, timing)).join("");

  renderStartsList(data);
  renderAdjustmentsList(data);

  const when = data.lastUpdatedAt ? new Date(data.lastUpdatedAt) : null;
  document.getElementById("footer").innerHTML = when
    ? `Last updated by <b>${esc(data.lastUpdatedBy || "—")}</b> · ` +
      `${when.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}, ` +
      `${when.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })} · live from Supabase`
    : "Live from Supabase";
}

// ---- roster lists -------------------------------------------------------
function matches(entry, q) {
  if (!q) return true;
  return `${entry.code || ""} ${entry.addedBy || ""}`.toLowerCase().includes(q);
}

// Each entry is identified by its creation timestamp (unique per click).
const entryKey = (r, kind) => kind === "start" ? r.dateAdded : r.date;
function findEntry(data, kind, key) {
  const arr = kind === "start" ? (data.newStarts || []) : (data.adjustments || []);
  return arr.find(e => entryKey(e, kind) === key);
}

function signed(n, dec = 2) {
  const v = Number(n) || 0;
  return (v >= 0 ? "+" : "−") + fmt(Math.abs(v), dec);
}

function rowHtml(r, kind) {
  const removed = r.removed === true;
  const key = esc(entryKey(r, kind));
  let cells;
  if (kind === "start") {
    cells =
      `<td><code>${esc(r.code)}</code></td>` +
      `<td>${fmt(Number(r.hours) || 0, 2)}</td>` +
      `<td>${esc(fmtDateTime(r.dateAdded))}</td>` +
      `<td>${esc(r.addedBy || "—")}</td>`;
  } else {
    const d = Number(r.delta) || 0;
    const cls = removed ? "" : (d >= 0 ? "delta-pos" : "delta-neg");
    cells =
      `<td><code>${esc(r.code)}</code></td>` +
      `<td class="${cls}">${signed(d)}</td>` +
      `<td>${esc(fmtDateTime(r.date))}</td>` +
      `<td>${esc(r.addedBy || "—")}</td>`;
  }
  const action = removed
    ? `<td></td>`
    : `<td><button type="button" class="rm-link" data-kind="${kind}" data-key="${key}">Remove</button></td>`;
  const note = removed
    ? `<tr class="rm-note"><td colspan="5">↳ removed by ${esc(r.removedBy || "—")}, ${esc(fmtDateTime(r.removedAt))}</td></tr>`
    : "";
  return `<tr class="${removed ? "removed" : ""}">${cells}${action}</tr>${note}`;
}

function renderList({ data, arrKey, kind, filterId, countId, listId, emptyMsg, dateField, headCols }) {
  const rows = (data[arrKey] || []).slice()
    .sort((a, b) => new Date(b[dateField]) - new Date(a[dateField]));
  const q = (document.getElementById(filterId).value || "").trim().toLowerCase();
  const shown = rows.filter(r => matches(r, q));
  const active = rows.filter(isActive).length;
  document.getElementById(countId).textContent =
    active === rows.length ? `(${rows.length})` : `(${active} active · ${rows.length} total)`;

  const wrap = document.getElementById(listId);
  if (!rows.length) { wrap.innerHTML = `<p class="empty">${emptyMsg}</p>`; return; }
  if (!shown.length) { wrap.innerHTML = `<p class="empty">No entries match “${esc(q)}”.</p>`; return; }

  wrap.innerHTML =
    `<table><thead><tr>${headCols.map(c => `<th>${c}</th>`).join("")}<th></th></tr></thead><tbody>` +
    shown.map(r => rowHtml(r, kind)).join("") +
    `</tbody></table>`;
}

function renderStartsList(data) {
  renderList({
    data, arrKey: "newStarts", kind: "start",
    filterId: "ns-filter", countId: "ns-list-count", listId: "ns-list",
    emptyMsg: "No new client starts logged yet.", dateField: "dateAdded",
    headCols: ["Code", "Hrs/day", "Date added", "Added by"]
  });
}

function renderAdjustmentsList(data) {
  renderList({
    data, arrKey: "adjustments", kind: "adj",
    filterId: "adj-filter", countId: "adj-list-count", listId: "adj-list",
    emptyMsg: "No adjustments logged yet.", dateField: "date",
    headCols: ["Code", "Change", "Date", "Added by"]
  });
}

// ---- data source: fetch + save ----------------------------------------
async function loadData() {
  const { data, error } = await db.from("progress").select("data").eq("id", ROW_ID).maybeSingle();
  if (error) throw new Error(error.message);
  if (!data) throw new Error(`No “${ROW_ID}” row in the progress table — run supabase-setup.sql.`);
  return data.data;
}

function rememberName(name) {
  try { localStorage.setItem(NAME_STORE, name); } catch (e) { /* private mode */ }
}

// Apply a mutation to a fresh copy of the loaded blob, persist, refetch, re-render.
async function commit(mutate, btn, msg) {
  if (!currentData) {
    msg.className = "save-msg err";
    msg.textContent = "Data hasn't loaded yet — refresh and try again.";
    return false;
  }
  btn.disabled = true;
  msg.className = "save-msg";
  msg.textContent = "Saving…";
  try {
    const next = JSON.parse(JSON.stringify(currentData));
    next.newStarts = next.newStarts || [];
    next.adjustments = next.adjustments || [];
    if (next.clientStarts) delete next.clientStarts.current; // derived now, don't persist
    if (next.abaHours) delete next.abaHours.current;
    mutate(next);
    next.lastUpdatedAt = new Date().toISOString();

    const { error } = await db.from("progress").update({ data: next }).eq("id", ROW_ID);
    if (error) throw new Error(error.message);

    render(await loadData()); // refetch so everyone sees the same live numbers
    msg.className = "save-msg ok";
    msg.textContent = "Saved ✓  Live for everyone.";
    return true;
  } catch (e) {
    msg.className = "save-msg err";
    msg.textContent = "Couldn't save (" + e.message + ").";
    return false;
  } finally {
    btn.disabled = false;
  }
}

async function addNewStart() {
  const btn = document.getElementById("ns-btn");
  const msg = document.getElementById("ns-msg");
  const codeEl = document.getElementById("ns-code");
  const hoursEl = document.getElementById("ns-hours");
  const code = codeEl.value.trim();
  const hours = Number(hoursEl.value);
  const name = document.getElementById("ns-name").value.trim();

  if (!code) { msg.className = "save-msg err"; msg.textContent = "Enter a client code."; return; }
  if (!Number.isFinite(hours) || hours <= 0) {
    msg.className = "save-msg err";
    msg.textContent = "Enter valid hours / day (greater than 0).";
    return;
  }
  const dup = (currentData?.newStarts || []).find(
    e => isActive(e) && (e.code || "").toLowerCase() === code.toLowerCase()
  );
  if (dup && !confirm(`“${dup.code}” is already an active start (added ${fmtDateTime(dup.dateAdded)} by ${dup.addedBy || "—"}).\nAdd another entry anyway?`)) return;

  rememberName(name);
  const ok = await commit(next => {
    next.newStarts.push({
      code,
      hours,
      dateAdded: new Date().toISOString(),
      addedBy: name || "anonymous"
    });
    next.lastUpdatedBy = name || "anonymous";
  }, btn, msg);

  if (ok) { codeEl.value = ""; hoursEl.value = ""; codeEl.focus(); }
}

async function addAdjustment() {
  const btn = document.getElementById("adj-btn");
  const msg = document.getElementById("adj-msg");
  const codeEl = document.getElementById("adj-code");
  const deltaEl = document.getElementById("adj-delta");
  const code = codeEl.value.trim();
  const raw = deltaEl.value.trim().replace(/^\+/, "");
  const delta = Number(raw);
  const name = document.getElementById("adj-name").value.trim();

  if (!code) { msg.className = "save-msg err"; msg.textContent = "Enter a client code."; return; }
  if (!raw || !Number.isFinite(delta) || delta === 0) {
    msg.className = "save-msg err";
    msg.textContent = "Enter an hours change like +1 or -5.";
    return;
  }

  rememberName(name);
  const ok = await commit(next => {
    next.adjustments.push({
      code,
      delta,
      date: new Date().toISOString(),
      addedBy: name || "anonymous"
    });
    next.lastUpdatedBy = name || "anonymous";
  }, btn, msg);

  if (ok) { codeEl.value = ""; deltaEl.value = ""; codeEl.focus(); }
}

// ---- soft-delete (remove) --------------------------------------------
let pendingRemoval = null;
const shortDate = iso => {
  const dt = new Date(iso);
  return isNaN(dt) ? String(iso ?? "—") : dt.toLocaleDateString(undefined, { month: "numeric", day: "numeric" });
};

function onRemoveClick(e) {
  const btn = e.target.closest(".rm-link");
  if (!btn) return;
  openRemoveModal(btn.dataset.kind, btn.dataset.key);
}

function openRemoveModal(kind, key) {
  const entry = findEntry(currentData || {}, kind, key);
  if (!entry) return;
  pendingRemoval = { kind, key };

  const detail = kind === "start"
    ? `Remove <b>${esc(entry.code)}</b>, ${fmt(Number(entry.hours) || 0, 2)} hrs/day, added ${esc(shortDate(entry.dateAdded))}?`
    : `Remove adjustment for <b>${esc(entry.code)}</b>, ${signed(entry.delta)} hrs, logged ${esc(shortDate(entry.date))}?`;
  document.getElementById("rm-detail").innerHTML = detail + " This keeps it in the log for audit, marked removed.";

  const nameEl = document.getElementById("rm-name");
  try { nameEl.value = localStorage.getItem(NAME_STORE) || ""; } catch (e) { nameEl.value = ""; }
  const msg = document.getElementById("rm-msg");
  msg.className = "save-msg";
  msg.textContent = "";
  document.getElementById("rm-modal").hidden = false;
  nameEl.focus();
}

function closeRemoveModal() {
  pendingRemoval = null;
  document.getElementById("rm-modal").hidden = true;
}

async function confirmRemoval() {
  if (!pendingRemoval) return;
  const { kind, key } = pendingRemoval;
  const msg = document.getElementById("rm-msg");
  const btn = document.getElementById("rm-confirm");
  const name = document.getElementById("rm-name").value.trim();

  if (!name) {
    msg.className = "save-msg err";
    msg.textContent = "Enter your name to confirm.";
    return;
  }
  rememberName(name);

  const ok = await commit(next => {
    const entry = findEntry(next, kind, key);
    if (!entry) throw new Error("entry no longer exists — refresh");
    entry.removed = true;
    entry.removedBy = name;
    entry.removedAt = new Date().toISOString();
    next.lastUpdatedBy = name;
  }, btn, msg);

  if (ok) closeRemoveModal();
}

// ---- boot -----------------------------------------------------------------
document.getElementById("ns-btn").addEventListener("click", addNewStart);
document.getElementById("adj-btn").addEventListener("click", addAdjustment);
document.getElementById("ns-filter").addEventListener("input", () => currentData && renderStartsList(currentData));
document.getElementById("adj-filter").addEventListener("input", () => currentData && renderAdjustmentsList(currentData));
document.getElementById("ns-list").addEventListener("click", onRemoveClick);
document.getElementById("adj-list").addEventListener("click", onRemoveClick);
document.getElementById("rm-cancel").addEventListener("click", closeRemoveModal);
document.getElementById("rm-confirm").addEventListener("click", confirmRemoval);
document.getElementById("rm-modal").addEventListener("click", e => {
  if (e.target === document.getElementById("rm-modal")) closeRemoveModal();
});
document.getElementById("rm-name").addEventListener("keydown", e => { if (e.key === "Enter") confirmRemoval(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !document.getElementById("rm-modal").hidden) closeRemoveModal();
});
try {
  const saved = localStorage.getItem(NAME_STORE);
  if (saved) {
    document.getElementById("ns-name").value = saved;
    document.getElementById("adj-name").value = saved;
  }
} catch (e) { /* private mode */ }

loadData()
  .then(render)
  .catch(e => {
    document.getElementById("footer").innerHTML =
      `<span class="save-msg err">Couldn't load data: ${esc(e.message)}</span>`;
  });
</script>
</body>
</html>
